name: Build and Release
permissions:
  contents: write
on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo builds
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config

      - name: Build binaries
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release

      - name: Archive ${{ matrix.target }}
        uses: vimtor/action-zip@v1.2
        with:
          files: >-
            target/${{ matrix.target }}/release/wallet-daemon${{
            startsWith(matrix.os, 'windows') && '.exe' || '' }}
          dest: wallet-daemon_${{github.ref_name}}_${{ matrix.target }}.zip

      - name: Upload artifacts ${{ matrix.target }}
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: wallet-daemon_${{github.ref_name}}_${{ matrix.target }}.zip
