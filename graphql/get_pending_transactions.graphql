query GetPendingTransactions($network: Network!, $chain: Chain!, $limit: Int! = 25, $cursor: String) {
  result: GetPendingTransactions(
    network: $network
    chain: $chain
    limit: $limit
    cursor: $cursor
  ) {
    data {
      wallet {
        externalId
      }
      uuid
      encodedData
    }
    nextCursor
  }
}