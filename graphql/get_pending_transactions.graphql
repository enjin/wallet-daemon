query GetPendingTransactions($limit: Int! = 25, $cursor: String) {
  result: GetPendingTransactions(
    limit: $limit
    cursor: $cursor
  ) {
    data {
      wallet {
        externalId
      }
      uuid
      encodedData
      network
      chain
      shouldSignFuelTank
      fuelTankSignerExternalId
    }
    nextCursor
  }
}