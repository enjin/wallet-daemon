[package]
name = "wallet-daemon"
version = "3.0.0"
edition = "2024"

[[bin]]
name = "wallet-daemon"
path = "src/main.rs"

[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[dependencies]
dotenvy = "0.15.7"
tracing = "0.1.41"
rpassword = "7.4.0"
subxt = { version = "0.50.0", default-features = false, features = ["native"] }
subxt-signer = "0.50.0"
backon = "1.5.2"
tokio = { version = "1.47.1", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
] }
graphql_client = "0.16.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"]}
parity-scale-codec = "3.7.5"
hex = "0.4.3"
tracing-subscriber = "0.3.19"
sp-core = { version = "*", default-features = false, features = ["std"] }
bip39 = { version = "2.2.0", features = ["rand"] }
lru = "0.16.0"
hex-literal = "1.1.0"
scale-info-legacy = "0.4.2"
