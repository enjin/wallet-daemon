[package]
name = "wallet-daemon"
version = "2.1.0"
edition = "2021"

[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[dependencies]
tracing = "0.1.41"
rpassword = "7.4.0"
subxt = { version = "0.43.0", features = ["native", "reconnecting-rpc-client"] }
subxt-signer = "0.43.0"
backoff = { version = "0.4.0", default-features = false, features = ["tokio"] }
backon = "1.5.2"
tokio = { version = "1.47.1", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
] }
graphql_client = "0.14.0"
reqwest = { version = "0.12.23", features = ["json"]  }
serde = { version = "1.0.219", default-features = false, features = ["derive"]}
serde_json = "1.0.143"
hex = "0.4.3"
tracing-subscriber = "0.3.19"
config = "0.15.14"
sp-core = { version = "38.0.0", default-features = false, features = [
    "std",
] }
bip39 = { version = "2.2.0", features = ["rand"] }
lru = "0.16.0"
