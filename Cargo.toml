[package]
name = "wallet-daemon"
version = "3.0.11"
edition = "2024"

[[bin]]
name = "wallet-daemon"
path = "src/main.rs"

[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[dependencies]
dotenvy = "0.15.7"
tracing = "0.1.41"
rpassword = "7.4.0"
subxt = { version = "0.50.0", default-features = false, features = ["native"] }
subxt-signer = "0.50.0"
backon = "1.5.2"
tokio = { version = "1.47.1", features = [
    "net",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3.32", features = ["sink"] }
graphql_client = "0.16.0"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"]}
parity-scale-codec = "3.7.5"
scale-encode = "0.10"
hex = "0.4.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
sp-core = { version = "*", default-features = false, features = ["std"] } # match the version subxt uses
bip39 = { version = "2.2.0", features = ["rand"] }
hex-literal = "1.1.0"
scale-info-legacy = "0.4.2"
aes-gcm = "0.10.3"
argon2 = "0.5"
rand = "0.10.0"
serde_json = "1.0.132"
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.15"
sp-crypto-hashing = "0.1"
tokio = { version = "1.47.1", features = ["test-util", "process"] }
# Mock Enjin Platform used by the end-to-end daemon tests. These crates are
# already in the dependency graph via reqwest; only the server features are new.
hyper = { version = "1.9.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.3"
